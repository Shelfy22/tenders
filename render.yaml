services:
  - type: web
    name: tender-autofill
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: N8N_AUTOFILL_WEBHOOK_URL
        value: https://halonkjurusun.beget.app/webhook/tender-autofill
      - key: PUBLIC_BASE_URL
        value: https://tenders-6pb1.onrender.com
      - key: N8N_JOB_TIMEOUT_MS
        value: "1200000"
